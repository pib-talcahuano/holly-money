name: Send scheduled requests

# Submits minister drafts whose scheduled date has arrived.
# Requires repo secrets APP_URL (e.g. https://app.example.com) and CRON_SECRET.
on:
  schedule:
    - cron: "0 11 * * *" # daily, 11:00 UTC (07:00/08:00 Santiago)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/send-scheduled-requests"
